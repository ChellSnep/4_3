<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Jokebook</title>
  </head>
  <body>
    <button id="btnCategories">Pobierz kategorie</button>
    <button id="btnRandom">Losowy żart</button>

    <h3>Dodaj żart</h3>
    <select id="category">
      <option value="funnyJoke">funnyJoke</option>
      <option value="lameJoke">lameJoke</option>
    </select>
    <input id="joke" />
    <input id="response" />
    <button id="btnAdd">Dodaj żart</button>
    <p id="addMessage"></p>

    <h3>Statystyki</h3>
    <button id="btnStats">Pokaż statystyki</button>
    <table id="statsTable" border="1"></table>

    <h3>Wyszukiwanie</h3>
    <input id="word" />
    <button id="btnSearch">Szukaj</button>
    <div id="searchResults"></div>

    <p id="output"></p>

    <script>
      const API = "http://localhost:3000";
      const output = document.getElementById("output");

      document.getElementById("btnCategories").onclick = async () => {
        const res = await fetch(`${API}/jokebook/categories`);
        const categories = await res.json();
        output.textContent = categories.join(", ");
      };

      document.getElementById("btnRandom").onclick = async () => {
        const res = await fetch(`${API}/jokebook/random`);
        const data = await res.json();
        output.textContent = `${data.joke} ${data.response}`;
      };

      document.getElementById("btnAdd").onclick = async () => {
        const category = document.getElementById("category").value;
        const joke = document.getElementById("joke").value;
        const response = document.getElementById("response").value;
        const message = document.getElementById("addMessage");

        try {
          const res = await fetch(`${API}/jokebook/joke/${category}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ joke, response }),
          });
          const data = await res.json();
          message.textContent = data.error
            ? `Błąd: ${data.error}`
            : data.message;
        } catch (err) {
          message.textContent = "Błąd: brak połączenia z serwerem";
        }
      };

      document.getElementById("btnStats").onclick = async () => {
        const res = await fetch(`${API}/jokebook/stats`);
        const stats = await res.json();
        const table = document.getElementById("statsTable");

        table.innerHTML = "<tr><th>Kategoria</th><th>Liczba żartów</th></tr>";
        for (const [category, count] of Object.entries(stats)) {
          const row = table.insertRow();
          row.insertCell().textContent = category;
          row.insertCell().textContent = count;
        }
      };

      document.getElementById("btnSearch").onclick = async () => {
        const word = document.getElementById("word").value;
        const box = document.getElementById("searchResults");
        box.innerHTML = "";

        const res = await fetch(
          `${API}/jokebook/search?word=${encodeURIComponent(word)}`,
        );
        const results = await res.json();

        if (!Array.isArray(results) || results.length === 0) {
          box.textContent = "Brak żartów pasujących do wyszukiwania";
          return;
        }

        results.forEach((item) => {
          const p = document.createElement("p");
          p.textContent = `[${item.category}] ${item.joke} — ${item.response}`;
          box.appendChild(p);
        });
      };
    </script>
  </body>
</html>
